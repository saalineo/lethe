[package]
name = "lethe"
version = "1.0.0"
edition = "2024"

[dependencies]
libc = "0.2"
libseccomp = "0.3.0"
signal-hook = "0.3"
zeroize = { version = "1.8", features = ["derive"] }
obfstr = "0.4"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
libloading = "0.8"
rand = "0.8"

[[bin]]
name = "lethe"
path = "src/main.rs"
