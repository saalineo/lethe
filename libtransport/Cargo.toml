[package]
name = "lethe-transport"
version = "1.0.0"
edition = "2024"

[lib]
name = "lethe"
crate-type = ["cdylib"]

[dependencies]
zeroize = { version = "1.8", features = ["derive"] }

arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "compression", "onion-service-client", "onion-service-service"] }
tor-hsservice = "=0.47.0"
tor-rtcompat = { version = "=0.47.0", features = ["tokio", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
futures = "0.3"
tor-cell = "=0.47.0"
tor-proto = "=0.47.0"
safelog = "=0.10.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
