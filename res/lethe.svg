<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <rect width="256" height="256" fill="#090A0D"/>
  <g transform="translate(128, 128)">
    <!-- Outer Hexagonal Frame -->
    <polygon points="0,-104 90,-52 90,52 0,104 -90,52 -90,-52" fill="none" stroke="#1E293B" stroke-width="3"/>
    
    <!-- Top-Left Facet (Stem) -->
    <polygon points="-68,-39 -16,-69 -16,30 -68,60" fill="#38BDF8"/>
    
    <!-- Bottom Facet (Horizontal Base of L) -->
    <polygon points="-16,30 36,0 88,30 36,60" fill="#0284C7"/>
    
    <!-- Top-Right Void Facet (Recessed) -->
    <polygon points="-16,-69 36,-99 88,-69 36,-39" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    
    <!-- Center Ingress Chasm -->
    <polygon points="-16,30 36,0 36,-39 -16,-69" fill="#0369A1"/>
  </g>
</svg>
